[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorcore"
version = "0.1.0"
description = "Local-first reasoning assistant for personalized troubleshooting and decision support"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=0.5.0"
]

[project.scripts]
mirrorcore = "mirrorcore.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]